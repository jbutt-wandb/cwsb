[project]
name = "cwsb"
version = "0.2.0"
description = "cwsb — CoreWeave Sandbox marimo notebooks: `cwsb marimo edit` and you're on a GPU."
requires-python = ">=3.11"
dependencies = ["cwsandbox>=1.19"]

[project.scripts]
cwsb = "cwsb.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cwsb"]
