[project]
name = "sb"
version = "0.1.0"
description = "Marimo-native CLI for GPU notebooks on CoreWeave Sandboxes: `sb marimo edit` and you're on a GPU."
requires-python = ">=3.11"
dependencies = ["cwsandbox>=1.19"]

[project.scripts]
sb = "sb.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sb"]
